[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lunguage-score"
version = "1.0.0"
description = "A comprehensive evaluation toolkit for medical report generation"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "Jonghak Moon", email = "jhak.moon@gmail.com" }
]
maintainers = [
  { name = "Jonghak Moon", email = "jhak.moon@gmail.com" }
]
keywords = ["medical", "nlp", "evaluation", "radiology", "reports"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "pandas>=1.3.0",
  "numpy>=1.21.0",
  "torch>=1.9.0",
  "transformers>=4.20.0",
  "openai>=1.0.0",
  "pyyaml>=6.0",
  "scikit-learn>=1.0.0",
  "scipy>=1.7.0",
  "matplotlib>=3.5.0",
  "seaborn>=0.12.0",
  "tqdm>=4.62.0",
  "requests>=2.28.0",
  "instructor>=1.0.0",
  "rank_bm25>=0.2.0",
  "rapidfuzz>=3.0.0",
  "fuzzywuzzy>=0.18.0",
]

[project.urls]
Homepage = "https://supersupermoon.github.io/Lunguage/"
Repository = "https://github.com/supersupermoon/Lunguage"
Documentation = "https://supersupermoon.github.io/Lunguage/"
"Bug Tracker" = "https://github.com/supersupermoon/Lunguage/issues"

[project.optional-dependencies]
sota = [
  "RaTEScore>=0.6.0",
  "evaluate>=0.4.0",
  "bert-score>=0.3.13",
  "sentence-transformers>=2.2.0",
]
claude = [
  "anthropic>=0.25.0",
]
dev = [
  "pytest>=6.0",
  "pytest-cov>=2.0",
  "black>=21.0",
  "flake8>=3.8",
  "mypy>=0.800",
]

[project.scripts]
lunguage-score = "lunguage_score.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["lunguage_score*"]
